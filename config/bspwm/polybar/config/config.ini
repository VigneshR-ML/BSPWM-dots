; Polybar main configuration (Apple Silicon HiDPI: 1512p @ 2x scale).
; Shared colours, fonts and modules are pulled in from the files below.

include-file = $HOME/.config/bspwm/polybar/config/colors.ini
include-file = $HOME/.config/bspwm/polybar/config/fonts.ini
include-file = $HOME/.config/bspwm/polybar/config/include-modules.ini

[bar/left]
width = 20%
height = 28pt
radius = 16

offset-x = 19.5
offset-y = 5

dpi = 150

background = ${color.color0}
foreground = ${color.foreground}

font-0 = "Iosevka Nerd Font:size=15.5;4"

padding-left = 2
padding-right = 5
module-margin = 5
separator-foreground = ${color.foreground}

modules-center = bspwm

cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true
fixed-center = false
wm-restack = bspwm

[bar/right]
width = 26%
height = 28pt
radius = 16

offset-x = 73.5%
offset-y = 5

dpi = 150

background = ${color.color0}
foreground = ${color.foreground}

font-0 = "Iosevka Nerd Font:size=15.5;4"

padding-left = 1
padding-right = 3
module-margin = 0
separator-foreground = ${color.foreground}

modules-right = netspeed gap temperature gap backlight gap pulseaudio gap battery

cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true
fixed-center = false
wm-restack = bspwm