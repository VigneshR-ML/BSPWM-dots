# libinput-gestures configuration
# 3-finger swipes (macOS-style trackpad gestures) for bspwm

# 3-finger left/right: switch desktop (workspace)
gesture swipe left  3 bspc desktop -f prev
gesture swipe right 3 bspc desktop -f next

# 3-finger up: open the desktop app launcher (rofi)
gesture swipe up    3 setsid rofi -dpi 144 -show drun -modi drun -theme ~/.config/bspwm/rofi/launcher.rasi

# 3-finger down: close the desktop rofi (launcher) only
gesture swipe down  3 pkill -f "rofi.*launcher.rasi"

# 2-finger left/right: also switch desktop
gesture swipe left  2 bspc desktop -f prev
gesture swipe right 2 bspc desktop -f next
